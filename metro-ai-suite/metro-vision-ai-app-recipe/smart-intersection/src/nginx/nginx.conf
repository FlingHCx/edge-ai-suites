events {
    worker_connections 1024;
}

http {
    client_max_body_size 2048M; 
    upstream dlstreamer {
        server dlstreamer-pipeline-server:8080;
    }

    upstream grafana {
        server grafana:3000;
    }

    upstream prometheus {
        server prometheus:9090;
    }

    upstream otel_collector_grpc {
        server otel-collector:4317;
    }

    upstream otel_collector_http {
        server otel-collector:4318;
    }

    upstream nodered {
        server node-red:1880;
    }

    upstream influxdb {
        server influxdb2:8086;
    }

    upstream scenescape {
        server web.scenescape.intel.com:443;
    }


    # HTTP server - redirect to HTTPS
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name localhost;

        # SSL configuration
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        
        # SSL security settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        
        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-XSS-Protection "1; mode=block";

        # SceneScape API endpoints (more specific than /api/)
        location /api/v1/ {
            proxy_pass https://scenescape/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # SSL verification settings for internal communication
            proxy_ssl_verify off;
            proxy_ssl_session_reuse on;
        }

        # DL Streamer Pipeline Server (for /api/pipelines/* etc.)
        location /api/ {
            proxy_pass http://dlstreamer/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Grafana dashboard
        location /grafana/ {
            proxy_pass http://grafana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support for Grafana
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Allow iframe embedding for Grafana
            add_header X-Frame-Options ALLOWALL always;
            add_header Content-Security-Policy "frame-ancestors *" always;
        }

        location /grafana/api/live/ws {
            proxy_pass http://grafana;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # Node-RED dashboard
        location /nodered/ {
            proxy_pass http://nodered/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support for Node-RED
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Prometheus
        location /prometheus/ {
            proxy_pass http://prometheus;
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for Grafana
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Allow iframe embedding for Grafana
            add_header X-Frame-Options ALLOWALL always;
            add_header Content-Security-Policy "frame-ancestors *" always;
        }

        # OTEL Collector HTTP
        location /otel-http/ {
            proxy_pass http://otel_collector_http/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OTEL Collector gRPC
        location /otel-grpc/ {
            grpc_pass grpc://otel_collector_grpc;
        }


        # InfluxDB Web UI - Note: InfluxDB doesn't support sub-path configuration well
        # Access directly via port or use a subdomain instead
        location /influxdb {
            return 301 https://$host/influxdb/;
        }
        
        location /influxdb/ {
            # Remove the /influxdb prefix when proxying to backend
            rewrite ^/influxdb/(.*) /$1 break;
            proxy_pass http://influxdb;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Handle redirects properly
            proxy_redirect http://influxdb/ /influxdb/;
            proxy_redirect https://influxdb/ /influxdb/;
        }


# Default root location - can serve a landing page or redirect
        location /testingLandingPage/ {
            return 200 '<!DOCTYPE html>
<html>
<head>
    <title>Metro Vision AI App - Smart Parking</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .service { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        a { color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>Metro Vision AI Application - Smart Parking</h1>
    <p>Available services:</p>
    <div class="service">
        <h3><a href="/grafana/">Grafana Dashboard</a></h3>
        <p>Monitoring and visualization dashboard</p>
    </div>
    <div class="service">
        <h3><a href="/nodered/">Node-RED Flow Editor</a></h3>
        <p>Visual flow-based development tool</p>
    </div>
    <div class="service">
        <h3><a href="/api/pipelines/status">DL Streamer API Pipeline Status</a></h3>
        <p>Deep Learning Streamer Pipeline Server API Pipeline Status</p>
    </div>
    <div class="service">
        <h3><a href="/prometheus/">Prometheus</a></h3>
        <p>Metrics monitoring and scraping</p>
    </div>
</body>
</html>';
            add_header Content-Type text/html;
        }

        # SceneScape Web Interface - Main UI
        location / {
            proxy_pass https://scenescape/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # SSL verification settings for internal communication
            proxy_ssl_verify off;
            proxy_ssl_session_reuse on;
            
            # WebSocket support for real-time updates
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Handle SceneScape authentication
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Server $host;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}

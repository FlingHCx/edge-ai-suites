allow_anonymous true

# Secure MQTT on Port 1883 (Required for sscape_adapter.py & dlstreamer)
listener 1883
cafile /mosquitto/secrets/root-cert
certfile /mosquitto/secrets/broker-cert
keyfile /mosquitto/secrets/broker-key
tls_version tlsv1.3

# Secure MQTT on Port 8883 (Standard secure MQTT port)
listener 8883
cafile /mosquitto/secrets/root-cert
certfile /mosquitto/secrets/broker-cert
keyfile /mosquitto/secrets/broker-key
tls_version tlsv1.3

# Secure WebSockets on Port 1884 (Required for Web UI / Browser)
listener 1884
cafile /mosquitto/secrets/root-cert
certfile /mosquitto/secrets/broker-cert
keyfile /mosquitto/secrets/broker-key
protocol websockets
